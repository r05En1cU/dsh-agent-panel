<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-agent-panel · demo harness</title>
<!--
  Zero-build static harness for the dsh-plugin-agent-team-panel browser half.

  It loads:
    - demo/vendor/react.production.min.js + react-dom.production.min.js (React 18.3.1 UMD, local)
    - ../client.js through demo/demo.js (fake window.__ModuleLoader__, real built client half)
    - demo/demo.js, which applies the plugin with fake native sessions and mounts the
      conversation.view component into #harness-root.

  URL parameters: state=overview|bundled|expanded|new-task|spawn|member|empty|failure,
                  client=<url>, badge=0
  Everything here is fabricated native projection data; nothing is a production DSH page.
-->
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #ffffff;
    color: #1f2328;
    font-family: ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  #harness-banner {
    display: none;
    flex: none;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.5;
    border-bottom: 1px solid rgba(127, 127, 127, 0.28);
    background: #fff6e5;
    color: #6b4a0b;
    max-height: 40vh;
    overflow: auto;
  }
  #harness-banner[data-tone="error"] { background: #fdecec; color: #8a2323; border-bottom-color: rgba(192, 68, 68, 0.35); }
  #harness-banner strong { display: block; margin-bottom: 2px; }
  #harness-root { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
  #harness-root > * { flex: 1 1 auto; min-width: 0; min-height: 0; }
  #harness-status {
    flex: none;
    height: 28px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    font-size: 11px;
    color: #5b6573;
    background: #f7f8fa;
    border-top: 1px solid rgba(127, 127, 127, 0.28);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  body[data-badge="0"] #harness-status { display: none; }
  #harness-diagnostic { max-width: 780px; margin: 32px; font-size: 13px; line-height: 1.6; }
  #harness-diagnostic h1 { font-size: 17px; margin: 0 0 6px; }
  #harness-diagnostic ul { padding-left: 20px; }
  #harness-diagnostic li { margin: 3px 0; word-break: break-word; }
  #harness-diagnostic p { color: #5b6573; }
</style>
</head>
<body data-badge="1" data-harness-ready="0">
<div id="harness-banner" role="status"></div>
<main id="harness-root"></main>
<footer id="harness-status">demo harness starting…</footer>
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script type="module" src="./demo.js"></script>
</body>
</html>
